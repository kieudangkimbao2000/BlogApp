services:
  backend:
    build: .
    ports:
      - "5060:5059"
    depends_on:
      - db
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: bloguser
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: blogapp
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
